name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Descomprimir archivos ZIP
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            unzip -o "$f" || true
          fi
        done

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permisos a Gradle
      run: |
        chmod +x gradlew 2>/dev/null || true
        find . -name "gradlew" -exec chmod +x {} \; || true

    - name: Compilar APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          GRADLE_DIR=$(find . -maxdepth 3 -name gradlew -exec dirname {} \; | head -n 1)
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR" && ./gradlew assembleDebug
          else
            echo "No se encontró el archivo gradlew en el proyecto."
            exit 1
          fi
        fi

    - name: Guardar en GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/*.apk'
